name: Release

# Runs when a version tag (made by `make release`) is pushed.
on:
  push:
    tags: ['v*.*.*']

# Publish one release at a time, in the order the tags were pushed, so two
# tags pushed together cannot race for GitHub's "Latest" flag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable # newest patch release, so binaries get standard-library security fixes
          check-latest: true
      - name: Test
        run: go vet ./... && go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            name="sysupdate_${VERSION}_linux_${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/$name/sysupdate" ./cmd/sysupdate
            cp README.md HELP.md CHANGELOG.md LICENSE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[.*\]: http/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        # GitHub marks the most recently published release as Latest, which
        # `sysupdate self-update` installs. Mark this one Latest only if it is
        # the highest stable tag on the remote right now (asked at publish
        # time, so tags pushed after the checkout count), never a prerelease.
        run: |
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          latest=false
          if [ "$VERSION" = "$highest" ]; then latest=true; fi
          echo "highest stable tag: ${highest:-none}; latest=$latest"
          gh release create "$VERSION" --title "sysupdate $VERSION" --notes-file notes.md --verify-tag \
            --latest="$latest" dist/*.tar.gz dist/checksums.txt
